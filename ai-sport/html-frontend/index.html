<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Sport 重构版</title>
    <style>
      :root {
        color: #0f172a;
        font-family: "Inter", "Noto Sans", system-ui, -apple-system, sans-serif;
        background-color: #0b1120;
      }
      body {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
        color: #e2e8f0;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      .pill {
        background: #1e293b;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 12px;
        color: #94a3b8;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 16px;
        margin-top: 20px;
      }
      section {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
      button {
        border: none;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #0b1120;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: #334155;
        color: #94a3b8;
        cursor: not-allowed;
      }
      video,
      canvas,
      img {
        width: 100%;
        border-radius: 12px;
        background: #020617;
      }
      .stats {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }
      .stat-card {
        flex: 1;
        background: #0b1224;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #1f2937;
      }
      .stat-title {
        font-size: 12px;
        color: #9ca3af;
      }
      .stat-value {
        font-size: 20px;
        font-weight: 700;
      }
      .logs {
        max-height: 260px;
        overflow: auto;
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.5;
        color: #cbd5e1;
        padding-left: 12px;
      }
      .badge {
        display: inline-block;
        margin-right: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #1d4ed8;
        color: white;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>AI Sport 重构版</h1>
        <div class="pill">HTML5 + JavaScript 前端 · FastAPI 后端 · MediaPipe</div>
      </div>
      <button id="create-user">创建测试用户</button>
    </header>

    <div class="grid">
      <section>
        <h2>摄像头采集</h2>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="preview" width="640" height="360"></canvas>
        <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center">
          <button id="toggle">开始检测</button>
          <span id="status" class="pill">等待初始化</span>
        </div>
        <div class="stats">
          <div class="stat-card">
            <div class="stat-title">实时得分</div>
            <div class="stat-value" id="score">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">动作计数</div>
            <div class="stat-value" id="reps">-</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">模型置信度</div>
            <div class="stat-value" id="confidence">-</div>
          </div>
        </div>
      </section>

      <section>
        <h2>训练记录</h2>
        <div class="pill">SQLite / Pandas / Matplotlib 汇总</div>
        <img id="chart" alt="训练趋势图" />
        <div class="logs" id="log"></div>
      </section>
    </div>

    <script>
      const video = document.getElementById("video");
      const canvas = document.getElementById("preview");
      const statusText = document.getElementById("status");
      const ctx = canvas.getContext("2d");
      const log = document.getElementById("log");
      const chart = document.getElementById("chart");
      const toggleBtn = document.getElementById("toggle");
      const createUserBtn = document.getElementById("create-user");

      let recording = false;
      let activeUser = null;
      let timer = null;

      const API_BASE = "http://localhost:8000";

      async function loadChart() {
        chart.src = `${API_BASE}/api/analytics/chart.png?ts=${Date.now()}`;
      }

      function appendLog(message) {
        const time = new Date().toLocaleTimeString();
        log.innerHTML = `<div><span class="badge">${time}</span>${message}</div>` + log.innerHTML;
      }

      async function initCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        statusText.textContent = "摄像头就绪";
      }

      function drawFrame(keypoints = []) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        if (keypoints.length) {
          ctx.strokeStyle = "#22c55e";
          ctx.fillStyle = "#22c55e";
          keypoints.forEach((kp) => {
            ctx.beginPath();
            ctx.arc(kp.x * canvas.width, kp.y * canvas.height, 4, 0, Math.PI * 2);
            ctx.fill();
          });
        }
      }

      async function analyzeFrame() {
        if (!recording) return;
        drawFrame();
        const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
        try {
          const response = await fetch(`${API_BASE}/api/pose/analyze`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image_b64: dataUrl, movement: "squat", user_id: activeUser?.id }),
          });
          if (!response.ok) throw new Error(await response.text());
          const result = await response.json();
          document.getElementById("score").textContent = result.score.toFixed(1);
          document.getElementById("reps").textContent = result.repetitions;
          document.getElementById("confidence").textContent = result.model_confidence.toFixed(2);
          drawFrame(result.keypoints || []);
          appendLog(`${result.message} | score=${result.score.toFixed(1)} reps=${result.repetitions}`);
          loadChart();
        } catch (error) {
          appendLog(`分析失败：${error}`);
        }
      }

      toggleBtn.addEventListener("click", () => {
        recording = !recording;
        toggleBtn.textContent = recording ? "停止检测" : "开始检测";
        statusText.textContent = recording ? "推理中" : "已暂停";
        if (recording) {
          analyzeFrame();
          timer = setInterval(analyzeFrame, 2000);
        } else if (timer) {
          clearInterval(timer);
        }
      });

      createUserBtn.addEventListener("click", async () => {
        const username = `demo_${Math.floor(Math.random() * 9999)}`;
        const payload = { username, display_name: `演示用户 ${username}` };
        const resp = await fetch(`${API_BASE}/api/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (resp.ok) {
          activeUser = await resp.json();
          appendLog(`创建用户 ${activeUser.username} 成功，后续检测会自动写入 SQLite。`);
        } else {
          appendLog("创建用户失败，请检查后端日志");
        }
      });

      initCamera().catch((err) => {
        statusText.textContent = "无法打开摄像头";
        appendLog(err.message);
      });
      loadChart();
    </script>
  </body>
</html>
